[project]
name = "taskweaver"
version = "1.0.0"
description = "YAML-driven task runner"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
taskweaver = "main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "dependencies", "runner", "parallel_runner", "main"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
