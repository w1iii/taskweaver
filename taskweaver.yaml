project:
  name: TaskWeaver
  version: "1.0.0"

settings:
  max_retries: 3
  timeout: 300

tasks:
  - name: lint
    command: "ruff check ."

  - name: test
    command: "pytest"
    retries: 0

  - name: build
    command: "python3 -m build"
    dependencies:
      - lint
      - test
    timeout: 600
